<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ameizing · portal</title>
<meta name="description" content="Your private ameizing site-care portal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=Heebo:wght@400;500;700&display=swap">
<style>
/* ========= ameizing portal ========= */
:root{
  --ink:#15131A; --paper:#FBFBF8; --cream:#efe2c9;
  --gold:#D7AD6A; --gold-deep:#B8893C;
  --line:#e7e3da; --muted:#6c6760; --ok:#2f7d55; --warn:#b4701f;
  --display:'Unbounded',sans-serif; --sans:'Archivo','Heebo',sans-serif; --he:'Heebo','Archivo',sans-serif;
  --radius:16px; --shadow:0 2px 18px rgba(21,19,26,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
html[dir="rtl"] body{font-family:var(--he)}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
.hidden{display:none !important}

/* top bar */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:14px 20px;background:rgba(251,251,248,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--gold-deep);text-decoration:none}
.brand i{font-style:normal;color:var(--ink)}
.bar-left{display:flex;align-items:center;gap:10px;min-width:0}
.bar-left .sep{width:1px;height:18px;background:var(--line)}
.sitename{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:54vw}
.bar-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
/* Maya welcome */
.welcome{display:flex;align-items:flex-start;gap:13px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:4px 0 20px}
.welcome .ava{flex-shrink:0;width:42px;height:42px;border-radius:50%;background:var(--gold-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:18px}
.welcome .wt{font-size:15.5px;line-height:1.55}
.welcome .wt b{display:block;margin-bottom:2px;font-size:16px}
.lang{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--ink)}
.linkbtn{border:none;background:none;color:var(--muted);font-size:14px;text-decoration:underline}

.wrap{max-width:760px;margin:0 auto;padding:24px 20px 80px}

/* login */
.login{max-width:420px;margin:9vh auto 0;text-align:center;padding:0 20px}
.login .mark{font-family:var(--display);font-weight:800;font-size:34px;color:var(--gold-deep);letter-spacing:-.02em}
.login .mark i{font-style:normal;color:var(--ink)}
.login h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,6vw,32px);margin:26px 0 8px;letter-spacing:-.02em}
.login p{color:var(--muted);margin:0 0 26px}
.login input{width:100%;text-align:center;letter-spacing:.14em;font-size:20px;font-weight:600;padding:16px;border:1.5px solid var(--line);border-radius:var(--radius);background:#fff;margin-bottom:14px}
.login input:focus{outline:none;border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;border-radius:var(--radius);
  background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:15px 24px;width:100%}
.btn:disabled{opacity:.5}
.btn.gold{background:var(--gold-deep)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.err{color:#b22;font-size:14px;min-height:20px;margin-top:6px}
.note{color:var(--warn);font-size:15px;background:#fdf6ec;border:1px solid #f0ddc0;border-radius:12px;padding:12px 14px;margin-top:14px}

/* request list */
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 18px}
.head h2{font-family:var(--display);font-weight:700;font-size:22px;margin:0;letter-spacing:-.02em}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.req{cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;transition:border-color .2s}
.req:hover{border-color:var(--gold)}
.req .t{font-weight:600;font-size:17px;margin:0 0 4px}
.req .sub{color:var(--muted);font-size:14px}
.pill{font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;white-space:nowrap}
.pill.new{background:#eef3ff;color:#2a4d9b}
.pill.work{background:#fff2e0;color:var(--warn)}
.pill.ready{background:#e9f6ef;color:var(--ok)}
.pill.done{background:#f1f0ee;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:50px 10px}
.empty svg{width:40px;height:40px;stroke:var(--gold);margin-bottom:10px}

/* thread */
.back{border:none;background:none;color:var(--muted);font-size:15px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;padding:0}
.back svg{width:16px;height:16px;stroke:currentColor}
.msg{margin-bottom:14px;display:flex;flex-direction:column;max-width:86%}
.msg .b{padding:12px 15px;border-radius:14px;font-size:16px}
.msg .meta{font-size:12px;color:var(--muted);margin-top:4px}
.msg.them{align-items:flex-start}
.msg.them .b{background:#fff;border:1px solid var(--line)}
.msg.me{align-items:flex-end;margin-inline-start:auto}
.msg.me .b{background:var(--ink);color:#fff}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.att a{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--gold-deep);text-decoration:none;
  border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff}
.att a svg{width:15px;height:15px;stroke:currentColor}

/* progress trail */
.track{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 16px 16px;margin-bottom:18px}
.steps{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;position:relative}
.step .dot{width:28px;height:28px;border-radius:50%;background:#ece7dd;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:700;border:2px solid #ece7dd;position:relative;z-index:1}
.step .lbl2{font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.3}
.step::before{content:"";position:absolute;top:13px;inset-inline-start:-50%;width:100%;height:2px;background:#ece7dd;z-index:0}
.step:first-child::before{display:none}
.step.done .dot{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff}
.step.done .lbl2{color:var(--ink)}
.step.done::before,.step.current::before{background:var(--gold-deep)}
.step.current .dot{background:var(--gold-deep);border-color:var(--gold-deep);color:#fff;box-shadow:0 0 0 4px rgba(215,173,106,.3)}
.step.current .lbl2{color:var(--ink);font-weight:700}
.track .desc{font-size:14.5px;color:var(--ink);margin-top:14px;line-height:1.5;text-align:center}
.track .desc.ready{color:var(--ok);font-weight:600}
.msg .who{font-size:12.5px;font-weight:700;color:var(--gold-deep);margin:0 0 4px 2px}

/* composer */
.composer{position:sticky;bottom:0;background:var(--paper);padding-top:12px;border-top:1px solid var(--line);margin-top:10px}
.field{width:100%;border:1.5px solid var(--line);border-radius:var(--radius);padding:13px 15px;font-size:16px;background:#fff;resize:vertical;min-height:52px}
.field:focus{outline:none;border-color:var(--gold)}
label.lbl{display:block;font-weight:600;font-size:14px;margin:0 0 6px;color:var(--ink)}
.row{display:flex;gap:10px;align-items:center;margin-top:10px}
.drop{border:1.5px dashed var(--line);border-radius:var(--radius);padding:16px;text-align:center;color:var(--muted);font-size:15px;margin-top:10px;background:#fff}
.drop svg{width:22px;height:22px;stroke:var(--gold);vertical-align:middle;margin-inline-end:6px}
.drop.over{border-color:var(--gold);background:#fffdf7}
.files{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.fitem{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.fitem .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .rm{border:none;background:none;color:#b22;font-size:18px;line-height:1}
.fitem.bad{border-color:#f0c7c7;background:#fdf1f1;color:#b22}
.help{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:15px;box-shadow:var(--shadow);z-index:40}
</style>
</head>
<body>

<!-- ======= LOGIN ======= -->
<section id="login" class="login">
  <div class="mark">ameiz<i>ing</i></div>
  <h1 data-t="loginTitle">הפורטל שלך</h1>
  <p data-t="loginSub">הזינו את הקוד הפרטי שקיבלתם כדי להיכנס.</p>
  <input id="code" inputmode="text" autocomplete="off" placeholder="••••••" aria-label="code">
  <button id="loginBtn" class="btn gold"><span data-t="enter">כניסה</span></button>
  <div id="loginErr" class="err"></div>
  <button class="lang" id="langLogin" type="button">English</button>
</section>

<!-- ======= APP ======= -->
<div id="app" class="hidden">
  <div class="bar">
    <div class="bar-left">
      <a class="brand" href="#">ameiz<i>ing</i></a>
      <span class="sep" id="sep" style="display:none"></span>
      <span class="sitename" id="siteName" dir="ltr"></span>
    </div>
    <div class="bar-right">
      <button class="lang" id="lang" type="button">English</button>
      <button class="linkbtn" id="logout" data-t="logout">יציאה</button>
    </div>
  </div>

  <div class="wrap">
    <!-- LIST VIEW -->
    <div id="listView">
      <div class="welcome">
        <div class="ava">M</div>
        <div class="wt"><b data-t="welcomeHi"></b><span data-t="welcomeBody"></span></div>
      </div>
      <div class="head">
        <h2 data-t="yourRequests">הבקשות שלך</h2>
        <button class="btn gold" id="newBtn" style="width:auto;padding:11px 18px"><span data-t="newReq">בקשה חדשה</span></button>
      </div>
      <div id="list"></div>
    </div>

    <!-- NEW REQUEST VIEW -->
    <div id="newView" class="hidden">
      <button class="back" id="newBack"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span data-t="back">חזרה</span></button>
      <div class="card">
        <label class="lbl" data-t="whatTitle">מה תרצו לשנות? (כותרת קצרה)</label>
        <input class="field" id="rTitle" style="min-height:0" placeholder="">
        <label class="lbl" style="margin-top:14px" data-t="pageLabel">קישור לעמוד שמדובר בו (לא חובה)</label>
        <input class="field" id="rPage" style="min-height:0" inputmode="url" dir="ltr" placeholder="https://">
        <label class="lbl" style="margin-top:14px" data-t="whatDetail">פירוט</label>
        <textarea class="field" id="rText" placeholder=""></textarea>

        <div class="drop" id="drop">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M12 16V4m0 0L8 8m4-4l4 4"/><path d="M20 16v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2"/></svg>
          <div data-t="dropHint">לחצו להעלאת תמונות, סרטונים או PDF (או גררו לכאן במחשב)</div>
          <button type="button" class="btn ghost" id="choose" style="width:auto;margin-top:12px;padding:11px 20px"><span data-t="choose">בחירת קבצים</span></button>
          <input type="file" id="file" multiple accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.mp4,.mov,.pdf" class="hidden">
        </div>
        <div class="files" id="files"></div>
        <div class="help" data-t="fileHelp"></div>

        <button class="btn" id="submitBtn" style="margin-top:16px"><span data-t="send">שליחה</span></button>
        <div id="newErr" class="err"></div>
      </div>
    </div>

    <!-- THREAD VIEW -->
    <div id="threadView" class="hidden">
      <button class="back" id="thrBack"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg><span data-t="back">חזרה</span></button>
      <div class="head"><h2 id="thrTitle"></h2><span id="thrPill"></span></div>
      <div id="thread"></div>
      <div class="composer">
        <div class="files" id="tFiles"></div>
        <textarea class="field" id="tText" placeholder=""></textarea>
        <div class="row">
          <button class="btn ghost" id="tAttach" style="width:auto;padding:13px 16px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/></svg>
            <span data-t="attach">קובץ</span>
          </button>
          <input type="file" id="tFile" multiple accept=".jpg,.jpeg,.png,.webp,.heic,.heif,.mp4,.mov,.pdf" class="hidden">
          <button class="btn" id="tSend"><span data-t="send">שליחה</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
